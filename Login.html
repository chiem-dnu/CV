<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #c4b5fd);
    }

    .login-box {
      width: 350px;
      max-width: 90%;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px #0002;
      text-align: center;
    }

    h2 {
      color: #4338ca;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Chào mừng bạn!</h2>
    <p>Nhấn nút bên dưới để vào website.</p>

    <button onclick="login()">Đăng nhập</button>
  </div>

  <script>
    function login() {
      sessionStorage.setItem("demoUser", "guest");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
